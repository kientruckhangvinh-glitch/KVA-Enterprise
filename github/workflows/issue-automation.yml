name: KVA Issue Automation

on:
  issues:
    types: [opened]

jobs:
  auto-assign-and-label:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign based on issue template/label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            let assignees = [];

            // ⚙️ CẤU HÌNH TỰ ĐỘNG GÁN VIỆC (Thay username thật vào đây)
            if (labels.includes('bug')) {
              assignees.push('kientruckhangvinh-glitch'); // Ví dụ: Trưởng phòng Kỹ thuật
            } 
            else if (labels.includes('document')) {
              assignees.push('kientruckhangvinh-glitch'); // Ví dụ: Phòng Hành chính/Kế toán
            }
            else if (labels.includes('task')) {
              assignees.push('kientruckhangvinh-glitch'); // Ví dụ: Quản lý dự án (PM)
            }

            // Thực hiện gán người (Assignee)
            if (assignees.length > 0) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: assignees
              });
              console.log(`Đã tự động gán việc cho: ${assignees.join(', ')}`);
            }
